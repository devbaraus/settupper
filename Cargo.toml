[package]
name = "settupper"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "settupper"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
strip-ansi-escapes = "0.2"
