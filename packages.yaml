$schema: https://github.com/devbaraus/settupper/blob/main/src/packages.schema.json
version: 1

groups:
  - id: cli
    name: Aplicações de Terminal
  - id: browser
    name: Navegadores
  - id: repos
    name: Repositórios
  - id: shell
    name: Shell e Terminal
  - id: dev-tools
    name: Ferramentas de Desenvolvimento
  - id: editors
    name: Editores
  - id: runtimes
    name: Runtimes
  - id: containers
    name: Containers
  - id: apps
    name: Aplicativos
  - id: system
    name: Sistema
  - id: browser
    name: Navegadores

apps:
  - id: settupper
    name: Settupper
    group: cli
    description: Gerenciador declarativo de pacotes com interface de terminal
    check:
      default:
        - command -v settupper || test -x "${SETTUPPER_INSTALL_ROOT:-$HOME/.local}/bin/settupper"
      windows:
        - where settupper || if exist "%LOCALAPPDATA%\Programs\settupper\bin\settupper.exe" (exit /b 0) else (exit /b 1)
    actions:
      install:
        default:
          - curl -fsSL https://raw.githubusercontent.com/devbaraus/settupper/main/install.sh | sh
        windows:
          - powershell -NoProfile -ExecutionPolicy Bypass -Command "irm https://raw.githubusercontent.com/devbaraus/settupper/main/install.ps1 | iex"
      update:
        default:
          - curl -fsSL https://raw.githubusercontent.com/devbaraus/settupper/main/install.sh | sh
        windows:
          - powershell -NoProfile -ExecutionPolicy Bypass -Command "irm https://raw.githubusercontent.com/devbaraus/settupper/main/install.ps1 | iex"
      uninstall:
        default:
          - rm -f "${SETTUPPER_INSTALL_ROOT:-$HOME/.local}/bin/settupper"
        windows:
          - if exist "%LOCALAPPDATA%\Programs\settupper\bin\settupper.exe" del /F /Q "%LOCALAPPDATA%\Programs\settupper\bin\settupper.exe"

  - id: chrome
    name: Google Chrome
    group: browser
    description: Navegador web do Google
    check:
      default:
        - command -v google-chrome
      arch:
        - command -v google-chrome-stable || command -v google-chrome
      windows:
        - where chrome
    actions:
      install:
        ubuntu:
          - wget -q -O google-chrome-stable_current_x86_64.deb  https://dl.google.com/linux/direct/google-chrome-stable_current_x86_64.deb
          - sudo dpkg -i google-chrome-stable_current_x86_64.deb
          - sudo apt-get install -f -y
          - rm google-chrome-stable_current_x86_64.deb
        fedora:
          - wget -q -O google-chrome-stable_current_x86_64.rpm https://dl.google.com/linux/direct/google-chrome-stable_current_x86_64.rpm
          - sudo dnf install google-chrome-stable_current_x86_64.rpm -y
          - rm google-chrome-stable_current_x86_64.rpm
        arch:
          - yay -S --noconfirm google-chrome
        macos:
          - brew install --cask google-chrome
        windows:
          - winget install --id Google.Chrome -e --source winget
      update:
        ubuntu:
          - wget -q -O google-chrome-stable_current_x86_64.deb  https://dl.google.com/linux/direct/google-chrome-stable_current_x86_64.deb
          - sudo dpkg -i google-chrome-stable_current_x86_64.deb
          - sudo apt-get install -f -y
          - rm google-chrome-stable_current_x86_64.deb
        fedora:
          - wget -q -O google-chrome-stable_current_x86_64.rpm https://dl.google.com/linux/direct/google-chrome-stable_current_x86_64.rpm
          - sudo dnf install google-chrome-stable_current_x86_64.rpm -y
          - rm google-chrome-stable_current_x86_64.rpm
        arch:
          - yay -Syu --noconfirm google-chrome
        macos:
          - brew upgrade --cask google-chrome
        windows:
          - winget upgrade --id Google.Chrome -e
      uninstall:
        ubuntu:
          - sudo apt remove google-chrome-stable -y
        fedora:
          - sudo dnf remove google-chrome-stable -y
        arch:
          - yay -Rns --noconfirm google-chrome
        macos:
          - brew uninstall --cask google-chrome
        windows:
          - winget uninstall --id Google.Chrome -e
  - id: dbeaver
    name: DBeaver
    group: database
    description: Ferramenta de gerenciamento de banco de dados universal
    check:
      default:
        - command -v dbeaver
    actions:
      install:
        ubuntu:
          - curl -L -o dbeaver-ce_latest_amd64.deb https://dbeaver.io/files/dbeaver-ce_latest_amd64.deb
          - sudo apt-get install ./dbeaver-ce_latest_amd64.deb -y
          - rm -f dbeaver-ce_latest_amd64.deb
        fedora:
          - curl -L -o dbeaver-ce-latest-stable.x86_64.rpm https://dbeaver.io/files/dbeaver-ce-latest-stable.x86_64.rpm
          - sudo dnf install ./dbeaver-ce-latest-stable.x86_64.rpm -y
        arch:
          - sudo pacman -S --noconfirm dbeaver
      update:
        ubuntu:
          - curl -L -o dbeaver-ce_latest_amd64.deb https://dbeaver.io/files/dbeaver-ce_latest_amd64.deb
          - sudo apt-get install ./dbeaver-ce_latest_amd64.deb -y
          - rm -f dbeaver-ce_latest_amd64.deb
        fedora:
          - curl -L -o dbeaver-ce-latest-stable.x86_64.rpm https://dbeaver.io/files/dbeaver-ce-latest-stable.x86_64.rpm
          - sudo dnf install ./dbeaver-ce-latest-stable.x86_64.rpm -y
        arch:
          - sudo pacman -Syu --noconfirm dbeaver
      uninstall:
        ubuntu:
          - sudo apt-get remove dbeaver-ce -y
        fedora:
          - sudo dnf remove dbeaver-ce -y
        arch:
          - sudo pacman -Rns --noconfirm dbeaver
  - id: terra-release
    name: Terra Repository
    group: repos
    description: Repositório Terra (Fyra Labs) para Fedora
    check:
      fedora:
        - dnf repolist | grep -q terra
    actions:
      install:
        fedora:
          - sudo dnf install --nogpgcheck --repofrompath 'terra,https://repos.fyralabs.com/terra$releasever' terra-release -y
      uninstall:
        fedora:
          - sudo dnf remove -y terra-release

  - id: rpmfusion
    name: RPM Fusion
    group: repos
    description: Repositórios RPM Fusion Free e Nonfree
    check:
      fedora:
        - dnf repolist | grep -q rpmfusion
    actions:
      install:
        fedora:
          - sudo dnf install https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm https://download1.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm -y
      uninstall:
        fedora:
          - sudo dnf remove -y rpmfusion-free-release rpmfusion-nonfree-release

  - id: yay
    name: Yay (AUR Helper)
    group: repos
    description: Helper para o Arch User Repository (AUR)
    check:
      arch:
        - command -v yay
    actions:
      install:
        arch:
          - sudo pacman -S --needed --noconfirm git base-devel
          - rm -rf /tmp/yay-bin && git clone https://aur.archlinux.org/yay-bin.git /tmp/yay-bin && (cd /tmp/yay-bin && makepkg -si --noconfirm) && rm -rf /tmp/yay-bin
      update:
        arch:
          - yay -Syu --noconfirm
      uninstall:
        arch:
          - sudo pacman -Rns --noconfirm yay-bin || sudo pacman -Rns --noconfirm yay

  # ── SHELL ──────────────────────────────────────────────────────────────────

  - id: fish
    name: Fish Shell
    group: shell
    description: Shell interativo moderno com autocompletar e syntax highlighting
    check:
      default:
        - command -v fish
    actions:
      install:
        fedora:
          - sudo dnf install fish -y
          - chsh -s $(which fish)
        ubuntu:
          - sudo apt install fish -y
          - chsh -s $(which fish)
        arch:
          - sudo pacman -S --noconfirm fish
          - chsh -s $(which fish)
        macos:
          - brew install fish
          - chsh -s $(which fish)
      update:
        fedora:
          - sudo dnf upgrade -y fish
        ubuntu:
          - sudo apt upgrade -y fish
        arch:
          - sudo pacman -Syu --noconfirm fish
        macos:
          - brew upgrade fish
      uninstall:
        fedora:
          - sudo dnf remove -y fish
        ubuntu:
          - sudo apt remove fish -y
        arch:
          - sudo pacman -Rns --noconfirm fish
        macos:
          - brew uninstall fish

  - id: starship
    name: Starship Prompt
    group: shell
    description: Prompt minimalista e rápido para qualquer shell
    depends_on:
      - fish
    check:
      default:
        - command -v starship
    actions:
      install:
        default:
          - curl -sS https://starship.rs/install.sh | sh
          - echo "starship init fish | source" >> ~/.config/fish/config.fish
      update:
        default:
          - curl -sS https://starship.rs/install.sh | sh
      uninstall:
        default:
          - sh -c "$(curl -sS https://starship.rs/install.sh)" -- --uninstall

  - id: fisher
    name: Fisher
    group: shell
    description: Gerenciador de plugins para Fish Shell
    depends_on:
      - fish
    check:
      default:
        - fish -c "fisher --version" 2>/dev/null
    actions:
      install:
        default:
          - curl -sL https://raw.githubusercontent.com/jorgebucaran/fisher/main/functions/fisher.fish | source && fisher install jorgebucaran/fisher
      update:
        default:
          - fish -c "fisher update"
      uninstall:
        default:
          - fish -c "fisher remove jorgebucaran/fisher"

  - id: sdkman-fish-plugin
    name: SDKMAN for Fish
    group: shell
    description: Plugin Fisher para integração do SDKMAN com Fish Shell
    depends_on:
      - fisher
      - sdkman
    check:
      default:
        - fish -c "fisher list" 2>/dev/null | grep -q sdkman-for-fish
    actions:
      install:
        default:
          - fish -c "fisher install reitzig/sdkman-for-fish@v2.1.0"
      uninstall:
        default:
          - fish -c "fisher remove reitzig/sdkman-for-fish"

  - id: zenbrowser
    name: Zen browser
    group: browser 
    description: Navegador Zen Browser
    check:
      default:
        - command -v zen-browser
    actions:
      install:
        fedora: 
          - sudo dnf copr enable sneexy/zen-browser -y
          - sudo dnf install zen-browser -y
        arch:
          - yay -S --noconfirm zen-browser-bin
      update:
        fedora:
          - sudo dnf upgrade zen-browser -y
        arch:
          - yay -Syu --noconfirm zen-browser-bin
      uninstall:
        fedora:
          - sudo dnf remove zen-browser -y
        arch:
          - yay -Rns --noconfirm zen-browser-bin

  # ── DEV TOOLS ──────────────────────────────────────────────────────────────
  - id: gitkraken
    name: GitKraken
    group: dev-tools
    description: Cliente Git gráfico e multiplataforma
    check:
      default:
        - command -v gitkraken
    actions:
      install:
        ubuntu:
          - curl -L -o gitkraken-amd64.deb https://release.gitkraken.com/linux/gitkraken-amd64.deb
          - sudo apt-get install ./gitkraken-amd64.deb -y
          - rm -f gitkraken-amd64.deb
        fedora:
          - sudo dnf install https://release.gitkraken.com/linux/gitkraken-amd64.rpm -y
        arch:
          - yay -S --noconfirm gitkraken
      update:
        ubuntu:
          - curl -L -o gitkraken-amd64.deb https://release.gitkraken.com/linux/gitkraken-amd64.deb
          - sudo apt-get install ./gitkraken-amd64.deb -y
          - rm -f gitkraken-amd64.deb
        fedora:
          - sudo dnf upgrade https://release.gitkraken.com/linux/gitkraken-amd64.rpm -y
        arch:
          - yay -Syu --noconfirm gitkraken
      uninstall:
        ubuntu:
          - sudo apt-get remove gitkraken -y
        fedora:
          - sudo dnf remove gitkraken -y
        arch:
          - yay -Rns --noconfirm gitkraken

  - id: git
    name: Git
    group: dev-tools
    description: Ferramenta de versionamento
    check:
      default:
        - command -v git
      windows:
        - where git
    actions:
      install:
        ubuntu:
          - sudo apt-get update
          - sudo apt-get install -y git
        fedora:
          - sudo dnf install -y git
        arch:
          - sudo pacman -S --noconfirm git
        macos:
          - brew install git
        windows:
          - winget install --id Git.Git -e --source winget
      update:
        ubuntu:
          - sudo apt-get install --only-upgrade -y git
        fedora:
          - sudo dnf upgrade -y git
        arch:
          - sudo pacman -Syu --noconfirm git
        macos:
          - brew upgrade git
        windows:
          - winget upgrade --id Git.Git -e
      uninstall:
        ubuntu:
          - sudo apt-get remove -y git
        fedora:
          - sudo dnf remove -y git
        arch:
          - sudo pacman -Rns --noconfirm git
        macos:
          - brew uninstall git
        windows:
          - winget uninstall --id Git.Git -e

  - id: development-tools
    name: Development Tools (grupo DNF)
    group: dev-tools
    description: Grupo de ferramentas de compilação e desenvolvimento (gcc, make, etc.)
    check:
      default:
        - command -v gcc
    actions:
      install:
        ubuntu:
          - sudo apt install build-essential -y
        fedora:
          - sudo dnf install @development-tools -y
        arch:
          - sudo pacman -S --needed --noconfirm base-devel
        macos:
          - xcode-select --install
      uninstall:
        ubuntu:
          - sudo apt remove build-essential -y
        fedora:
          - sudo dnf group remove -y development-tools
        arch:
          - sudo pacman -Rns --noconfirm base-devel
        macos:
          - xcode-select --uninstall
          
  # ── EDITORS ────────────────────────────────────────────────────────────────

  - id: ttt
    name: TTT Editor
    group: editors
    description: Editor de código para o terminal
    check:
      default:
        - command -v ttt || test -x "${INSTALL_DIR:-$HOME/.local/bin}/ttt"
      windows:
        - where ttt
    actions:
      install:
        default:
          - curl -sSfL https://raw.githubusercontent.com/eugenioenko/ttt/main/install.sh | sh
        arch:
          - yay -S --noconfirm ttt
        macos:
          - brew tap eugenioenko/ttt
          - brew trust eugenioenko/ttt
          - brew install ttt
        windows:
          - scoop install ttt
      update:
        default:
          - curl -sSfL https://raw.githubusercontent.com/eugenioenko/ttt/main/install.sh | sh
        arch:
          - yay -S --noconfirm ttt
        macos:
          - brew upgrade ttt
        windows:
          - scoop update ttt
      uninstall:
        default:
          - rm -f "${INSTALL_DIR:-$HOME/.local/bin}/ttt"
        arch:
          - yay -Rns --noconfirm ttt
        macos:
          - brew uninstall ttt
        windows:
          - scoop uninstall ttt

  - id: vscode
    name: VS Code
    group: editors
    description: Editor de código
    check:
      default:
        - command -v code
      windows:
        - where code
    actions:
      install:
        ubuntu:
          - sudo snap install code --classic
        fedora:
          - sudo rpm --import https://packages.microsoft.com/keys/microsoft.asc
          - echo -e "[code]\nname=Visual Studio Code\nbaseurl=https://packages.microsoft.com/yumrepos/vscode\nenabled=1\nautorefresh=1\ntype=rpm-md\ngpgcheck=1\ngpgkey=https://packages.microsoft.com/keys/microsoft.asc" | sudo tee /etc/yum.repos.d/vscode.repo > /dev/null
          - sudo dnf install code
        arch:
          - yay -S --noconfirm visual-studio-code-bin
        macos:
          - brew install --cask visual-studio-code
        windows:
          - winget install --id Microsoft.VisualStudioCode -e --source winget
      update:
        ubuntu:
          - sudo snap refresh code
        fedora:
          - sudo dnf upgrade -y code
        arch:
          - yay -Syu --noconfirm visual-studio-code-bin
        macos:
          - brew upgrade --cask visual-studio-code
        windows:
          - winget upgrade --id Microsoft.VisualStudioCode -e
      uninstall:
        ubuntu:
          - sudo snap remove code
        fedora:
          - sudo dnf remove -y code
        arch:
          - yay -Rns --noconfirm visual-studio-code-bin
        macos:
          - brew uninstall --cask visual-studio-code
        windows:
          - winget uninstall --id Microsoft.VisualStudioCode -e


# AI CLI
  - id: antigravity-cli
    name: Antigravity CLI
    group: cli
    check:
      default:
        - command -v agy
    actions:
      install:
        ubuntu:
          - curl -fsSL https://antigravity.google/cli/install.sh | bash
        fedora:
          - curl -fsSL https://antigravity.google/cli/install.sh | bash
        arch:
          - curl -fsSL https://antigravity.google/cli/install.sh | bash
      update:
        ubuntu:
          - curl -fsSL https://antigravity.google/cli/install.sh
        fedora:
          - curl -fsSL https://antigravity.google/cli/install.sh
        arch:
          - curl -fsSL https://antigravity.google/cli/install.sh
      uninstall:
        ubuntu:
          - rm -rf ~/.local/bin/ag ~/.local/bin/agy
          - rm -rf ~/.antigravity-server ~/.antigravity
        fedora:
          - rm -rf ~/.local/bin/ag ~/.local/bin/agy
          - rm -rf ~/.antigravity-server ~/.antigravity
        arch:
          - rm -rf ~/.local/bin/ag ~/.local/bin/agy
          - rm -rf ~/.antigravity-server ~/.antigravity

  - id: claude-code
    name: Claude Code
    group: cli
    check:
      default:
        - command -v claude
    actions:
      install:
        ubuntu:
          - npm i -g @anthropic-ai/claude-code
        fedora:
          - npm i -g @anthropic-ai/claude-code
        arch:
          - npm i -g @anthropic-ai/claude-code
      update:
        ubuntu:
          - npm i -g @anthropic-ai/claude-code@latest
        fedora:
          - npm i -g @anthropic-ai/claude-code@latest
        arch:
          - npm i -g @anthropic-ai/claude-code@latest
      uninstall:
        ubuntu:
          - npm uninstall -g @anthropic-ai/claude-code
        fedora:
          - npm uninstall -g @anthropic-ai/claude-code
        arch:
          - npm uninstall -g @anthropic-ai/claude-code

  - id: OpenAI Codex
    name: OpenAI Codex
    group: cli
    check:
      default:
        - command -v codex
    actions:
      install:
        ubuntu:
          - npm i -g @openai/codex
        fedora:
          - npm i -g @openai/codex
        arch:
          - npm i -g @openai/codex
      update:
        ubuntu:
          - npm i -g @openai/codex@latest
        fedora:
          - npm i -g @openai/codex@latest
        arch:
          - npm i -g @openai/codex@latest
      uninstall:
        ubuntu:
          - npm uninstall -g @openai/codex
        fedora:
          - npm uninstall -g @openai/codex
        arch:
          - npm uninstall -g @openai/codex

  # ── RUNTIMES ───────────────────────────────────────────────────────────────
  - id: rust
    name: Rust
    group: runtimes
    description: Linguagem de programação Rust
    check:
      default:
        - command -v rustup
    actions:
      install:
        default:
          - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh
      update:
        default:
          - rustup update
      uninstall:
        default:
          - rustup self uninstall

  - id: cargo
    name: Cargo
    group: runtimes
    description: Gerenciador de pacotes e sistema de build do Rust
    depends_on:
      - rust
    check:
      default:
        - command -v cargo || test -x "$HOME/.cargo/bin/cargo"
      windows:
        - where cargo
    actions:
      install:
        ubuntu:
          - command -v rustup >/dev/null 2>&1 && rustup toolchain install stable || sudo apt-get install -y cargo
        fedora:
          - command -v rustup >/dev/null 2>&1 && rustup toolchain install stable || sudo dnf install -y cargo
        arch:
          - command -v rustup >/dev/null 2>&1 && rustup toolchain install stable || sudo pacman -S --noconfirm rust
        macos:
          - command -v rustup >/dev/null 2>&1 && rustup toolchain install stable || brew install rust
        windows:
          - winget install --id Rustlang.Rustup -e --source winget
        default:
          - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      update:
        ubuntu:
          - command -v rustup >/dev/null 2>&1 && rustup update || sudo apt-get install --only-upgrade -y cargo
        fedora:
          - command -v rustup >/dev/null 2>&1 && rustup update || sudo dnf upgrade -y cargo
        arch:
          - command -v rustup >/dev/null 2>&1 && rustup update || sudo pacman -Syu --noconfirm rust
        macos:
          - command -v rustup >/dev/null 2>&1 && rustup update || brew upgrade rust
        windows:
          - rustup update
        default:
          - rustup update
      uninstall:
        ubuntu:
          - command -v rustup >/dev/null 2>&1 && rustup self uninstall -y || sudo apt-get remove -y cargo
        fedora:
          - command -v rustup >/dev/null 2>&1 && rustup self uninstall -y || sudo dnf remove -y cargo
        arch:
          - command -v rustup >/dev/null 2>&1 && rustup self uninstall -y || sudo pacman -Rns --noconfirm rust
        macos:
          - command -v rustup >/dev/null 2>&1 && rustup self uninstall -y || brew uninstall rust
        windows:
          - winget uninstall --id Rustlang.Rustup -e
        default:
          - rustup self uninstall -y

  - id: go
    name: Go
    group: runtimes
    description: Linguagem de programação Go (Golang)
    check:
      default:
        - command -v go
      windows:
        - where go
    actions:
      install:
        ubuntu:
          - sudo apt-get update
          - sudo apt-get install -y golang-go
        fedora:
          - sudo dnf install -y golang
        arch:
          - sudo pacman -S --noconfirm go
        macos:
          - brew install go
        windows:
          - winget install --id GoLang.Go -e --source winget
      update:
        ubuntu:
          - sudo apt-get install --only-upgrade -y golang-go
        fedora:
          - sudo dnf upgrade -y golang
        arch:
          - sudo pacman -Syu --noconfirm go
        macos:
          - brew upgrade go
        windows:
          - winget upgrade --id GoLang.Go -e
      uninstall:
        ubuntu:
          - sudo apt-get remove -y golang-go
        fedora:
          - sudo dnf remove -y golang
        arch:
          - sudo pacman -Rns --noconfirm go
        macos:
          - brew uninstall go
        windows:
          - winget uninstall --id GoLang.Go -e

  - id: volta
    name: Volta
    group: runtimes
    description: Gerenciador de versões JavaScript (Node.js e Bun)
    depends_on:
      - fish
    check:
      default:
        - command -v volta
    actions:
      install:
        default:
          - curl https://get.volta.sh | bash
          - source ~/.config/fish/config.fish
          - volta install node
          - volta install bun
      update:
        default:
          - volta install node
          - volta install bun
      uninstall:
        default:
          - rm -rf "$HOME/.volta"

  - id: bun
    name: Bun
    group: runtimes
    description: Gerenciador de pacotes JavaScript
    check:
      default:
        - command -v bun
    actions:
      install:
        default:
          - volta install bun
      update:
        default:
          - bun upgrade
      uninstall:
        default:
          - volta uninstall bun
  
  - id: nodejs
    name: NodeJS
    group: runtimes
    description: Ambiente de execução JavaScript
    depends_on:
      - volta
    check:
      default:
        - command -v node
    actions:
      install:
        default:
          - volta install node
      update:
        default:
          - volta install node
      uninstall:
        default:
          - volta uninstall node

  - id: uv
    name: uv
    group: runtimes
    description: Gerenciador de pacotes e projetos Python (Astral)
    check:
      default:
        - command -v uv
    actions:
      install:
        default:
          - curl -LsSf https://astral.sh/uv/install.sh | sh
          - source ~/.config/fish/config.fish
      update:
        default:
          - uv self update
      uninstall:
        default:
          - rm -f $(which uv)
  - id: pyenv
    name: Pyenv
    group: runtimes
    description: Gerenciador de versões Python
    check:
      default:
        - command -v pyenv
    actions:
      install:
        default:
          - curl -fsSL https://pyenv.run | bash
          - set -Ux PYENV_ROOT $HOME/.pyenv
          - test -d $PYENV_ROOT/bin; and fish_add_path $PYENV_ROOT/bin
          - pyenv init - fish | source
      update:
        default:
          - pyenv update
      uninstall:
        default:
          - rm -rf $(pyenv root)

  - id: poetry
    name: Poetry
    group: runtimes
    description: Gerenciador de dependências e empacotamento Python
    check:
      default:
        - command -v poetry
    actions:
      install:
        default:
          - curl -sSL https://install.python-poetry.org | python3 -
      update:
        default:
          - poetry self update
      uninstall:
        default:
          - curl -sSL https://install.python-poetry.org | python3 - --uninstall

  - id: sdkman
    name: SDKMAN
    group: runtimes
    description: Gerenciador de SDKs para JVM (Java, Kotlin, Scala, etc.)
    check:
      default:
        - test -d "$HOME/.sdkman"
    actions:
      install:
        default:
          - curl -s "https://get.sdkman.io" | bash
      update:
        default:
          - bash -c 'source "$HOME/.sdkman/bin/sdkman-init.sh" && sdk selfupdate'
      uninstall:
        default:
          - rm -rf "$HOME/.sdkman"

  # ── CONTAINERS ─────────────────────────────────────────────────────────────

  - id: docker
    name: Docker
    group: containers
    description: Plataforma de containers
    check:
      default:
        - command -v docker
    actions:
      install:
        ubuntu:
          - curl -fsSL https://get.docker.com | sudo sh
          - sudo systemctl enable --now docker
          - sudo groupadd docker || true
          - sudo usermod -aG docker $USER
        fedora:
          - sudo dnf config-manager addrepo --from-repofile https://download.docker.com/linux/fedora/docker-ce.repo
          - sudo dnf install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin -y
          - sudo systemctl enable --now docker
          - sudo groupadd docker || true
          - sudo usermod -aG docker $USER
        arch:
          - sudo pacman -S --noconfirm docker docker-buildx docker-compose
          - sudo systemctl enable --now docker
          - sudo groupadd docker || true
          - sudo usermod -aG docker $USER
      update:
        ubuntu:
          - sudo apt-get update && sudo apt-get install --only-upgrade -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
        fedora:
          - sudo dnf upgrade -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
        arch:
          - sudo pacman -Syu --noconfirm docker docker-buildx docker-compose
      uninstall:
        ubuntu:
          - sudo apt-get remove -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          - sudo systemctl disable --now docker || true
        fedora:
          - sudo dnf remove -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          - sudo systemctl disable --now docker || true
        arch:
          - sudo pacman -Rns --noconfirm docker docker-buildx docker-compose
          - sudo systemctl disable --now docker || true

  - id: docker-network-config
    name: Docker Network Config (PUC)
    group: containers
    description: Configuração de rede do Docker para evitar conflito de IPs (padrão PUC)
    depends_on:
      - docker
    check:
      default:
        - test -f /etc/docker/daemon.json && grep -q "default-address-pools" /etc/docker/daemon.json
    actions:
      install:
        default:
          - sudo mkdir -p /etc/docker/
          - |
            echo '{
              "bip": "192.168.1.1/24",
              "default-address-pools": [
                {
                  "base": "10.0.0.0/8",
                  "size": 24
                }
              ]
            }' | sudo tee /etc/docker/daemon.json
          - sudo systemctl restart docker
      uninstall:
        default:
          - sudo rm -f /etc/docker/daemon.json
          - sudo systemctl restart docker

