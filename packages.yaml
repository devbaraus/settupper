  # ── SYSTEM ─────────────────────────────────────────────────────────────────

  - id: audio-powersave-fix
    name: Audio Power Save Fix
    group: system
    description: Desativa power save do driver snd_hda_intel para evitar pop/clique no som
    check:
      default:
        - grep -q "power_save=0" /etc/modprobe.d/audio_disable_powersave.conf 2>/dev/null
    actions:
      install:
        default:
          - echo "0" | sudo tee /sys/module/snd_hda_intel/parameters/power_save
          - echo "options snd_hda_intel power_save=0" | sudo tee -a /etc/modprobe.d/audio_disable_powersave.conf
      uninstall:
        default:
          - sudo sed -i '/options snd_hda_intel power_save=0/d' /etc/modprobe.d/audio_disable_powersave.conf
